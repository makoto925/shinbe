<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <link rel="apple-touch-icon" href="https://otarufoodsystem.github.io/timecardApp/tm_icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OFSタイムカード">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OFSタイムカード</title>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #ffffff; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <!-- allow="geolocation" に加え、明示的にGASドメインへの権限委譲を指定 -->
  <iframe id="timecard-frame" src="" allow="geolocation 'src' https://script.google.com"></iframe>

  <script>
    const gasBaseUrl = "https://script.google.com/macros/s/AKfycbyO0Ig81Gi3DUqXR0d-2z3fZdzBfEsx7e8FyKvtAtBFu9XsLyxwyt0dMX9bVrwMxuUw6Q/exec";

    window.onload = function() {
      const urlParams = new URLSearchParams(window.location.search);
      let storeName = urlParams.get('s');
      const iframeSrc = storeName ? `${gasBaseUrl}?s=${encodeURIComponent(storeName)}` : gasBaseUrl;
      document.getElementById('timecard-frame').src = iframeSrc;
    };

// 💡 ユーザー操作タイミングで親画面から強制的にGPSを起動し、ダイアログを1発で出す仕組み
    window.addEventListener("message", function(event) {
      // 💡【修正】GASウェブアプリの実際のドメイン（script.google.com および googleusercontent.com）を許可
      if (!event.origin.startsWith("https://script.google.com") && !event.origin.endsWith(".googleusercontent.com")) {
        return;
      }

      if (event.data && event.data.type === "REQUEST_GPS") {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            function(position) {
              // 成功時：位置情報を子画面（GAS）に送り返す
              event.source.postMessage({
                type: "GPS_RESPONSE",
                success: true,
                lat: position.coords.latitude,
                lng: position.coords.longitude
              }, event.origin);
            },
            function(error) {
              // 失敗時
              let errMsg = "位置情報の取得に失敗しました。";
              if (error.code === 1) errMsg = "位置情報の利用が拒否されました。設定を確認してください。";
              event.source.postMessage({
                type: "GPS_RESPONSE",
                success: false,
                error: errMsg
              }, event.origin);
            },
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
          );
        } else {
          event.source.postMessage({
            type: "GPS_RESPONSE",
            success: false,
            error: "この端末は位置情報に対応していません。"
          }, event.origin);
        }
      }
    });
  </script>
</body>
</html>
